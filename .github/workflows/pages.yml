name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            introduction/package-lock.json
            descriptive-statistics/package-lock.json
            probability/package-lock.json
            discrete-distributions/package-lock.json
            continuous-distributions/package-lock.json
            calendar/package-lock.json

      - name: Install and build introduction
        run: |
          npm ci --prefix introduction
          npm run build --prefix introduction

      - name: Install and build descriptive-statistics
        run: |
          npm ci --prefix descriptive-statistics
          npm run build --prefix descriptive-statistics

      - name: Install and build probability
        run: |
          npm ci --prefix probability
          npm run build --prefix probability

      - name: Install and build discrete-distributions
        run: |
          npm ci --prefix discrete-distributions
          npm run build --prefix discrete-distributions

      - name: Install and build continuous-distributions
        run: |
          npm ci --prefix continuous-distributions
          npm run build --prefix continuous-distributions

      - name: Install and build calendar
        run: |
          npm ci --prefix calendar
          npm run build --prefix calendar

      - name: Assemble site
        run: |
          mkdir -p _site/introduction _site/descriptive-statistics _site/probability _site/discrete-distributions _site/continuous-distributions _site/calendar _site/inclass
          cp -r introduction/dist/* _site/introduction/
          cp -r descriptive-statistics/dist/* _site/descriptive-statistics/
          cp -r probability/dist/* _site/probability/
          cp -r discrete-distributions/dist/* _site/discrete-distributions/
          cp -r continuous-distributions/dist/* _site/continuous-distributions/
          cp -r calendar/dist/* _site/calendar/
          cp -r site/inclass/* _site/inclass/
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
