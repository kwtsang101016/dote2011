name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            introduction/package-lock.json
            descriptive-statistics/package-lock.json
            probability/package-lock.json

      - name: Install and build introduction
        run: |
          npm ci --prefix introduction
          npm run build --prefix introduction

      - name: Install and build descriptive-statistics
        run: |
          npm ci --prefix descriptive-statistics
          npm run build --prefix descriptive-statistics

      - name: Install and build probability
        run: |
          npm ci --prefix probability
          npm run build --prefix probability

      - name: Assemble site
        run: |
          mkdir -p _site/introduction _site/descriptive-statistics _site/probability
          cp -r introduction/dist/* _site/introduction/
          cp -r descriptive-statistics/dist/* _site/descriptive-statistics/
          cp -r probability/dist/* _site/probability/
          cp site/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
